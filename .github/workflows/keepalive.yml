name: Keep Supabase Alive

on:
  schedule:
    # Setiap 3 hari jam 00:00 UTC
    - cron: '0 0 */1 * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |     
          echo "${{ secrets.SUPABASE_URL }}/rest/v1/user_roles?select=id&limit=1"
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_roles?select=id&limit=1"
